---
- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: not ansible_check_mode

- name: Download Docker package signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not ansible_check_mode

- name: Register official Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: not ansible_check_mode

- name: Install optional Docker Sandboxes CLI
  ansible.builtin.apt:
    name: docker-sbx
    state: present
  when:
    - not ansible_check_mode
    - fleet_enable_sbx | bool

- name: Start Docker Engine on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Optionally grant root-equivalent Docker group access
  ansible.builtin.user:
    name: "{{ fleet_admin_user }}"
    groups: docker
    append: true
  when:
    - not ansible_check_mode
    - fleet_allow_docker_group | bool
